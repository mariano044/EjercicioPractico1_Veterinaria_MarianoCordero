<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: plantilla(~{::title}, ~{::main})}">
<head>
    <title>Tipos de servicio | Patitas Felices</title>
</head>
<body>
<main class="container pt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h2 class="titulo-pagina mb-0">Tipos de servicio</h2>
        <a class="btn btn-clinica" th:href="@{/tipos/nuevo}"><i class="bi bi-plus-circle me-1"></i>Agregar tipo</a>
    </div>

    <div class="tabla-clinica table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th class="text-center">Servicios asociados</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tipo : ${listaTipos}">
                <td class="fw-semibold" th:text="${tipo.nombre}">Nombre</td>
                <td th:text="${tipo.descripcion}">Descripción</td>
                <td class="text-center">
                    <span class="badge rounded-pill insignia-cantidad" th:text="${tipo.cantidadServicios}">0</span>
                </td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/tipos/editar/{id}(id=${tipo.id})}">
                        <i class="bi bi-pencil-square"></i> Editar</a>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="modal" data-bs-target="#modalEliminar"
                            th:attr="data-id=${tipo.id}, data-nombre=${tipo.nombre}">
                        <i class="bi bi-trash3"></i> Eliminar
                    </button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listaTipos)}">
                <td colspan="4" class="text-center text-muted py-4">Aún no hay tipos de servicio. Agregue el primero.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/componentes :: modalEliminar('/tipos/eliminar')}"></div>
</main>
</body>
</html>
