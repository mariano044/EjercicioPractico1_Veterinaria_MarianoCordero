<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: plantilla(~{::title}, ~{::main})}">
<head>
    <title>Tipo de servicio | Patitas Felices</title>
</head>
<body>
<main class="container pt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h2 class="titulo-pagina" th:text="${tipoServicio.id == null} ? 'Agregar tipo de servicio' : 'Editar tipo de servicio'">Tipo de servicio</h2>
            <form class="formulario-clinica" th:action="@{/tipos/guardar}" th:object="${tipoServicio}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}" maxlength="100" required>
                </div>
                <div class="mb-4">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <input type="text" id="descripcion" class="form-control" th:field="*{descripcion}" maxlength="255">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/tipos}">Cancelar</a>
                    <button type="submit" class="btn btn-clinica"><i class="bi bi-check2-circle me-1"></i>Guardar tipo</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
