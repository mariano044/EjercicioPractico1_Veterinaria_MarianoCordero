<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ENCABEZADO -->
<header th:fragment="encabezado" class="encabezado-clinica">
    <div class="container d-flex align-items-center gap-3 py-3">
        <span class="encabezado-logo" aria-hidden="true"><i class="bi bi-balloon-heart-fill"></i></span>
        <div>
            <h1 class="encabezado-titulo mb-0" th:text="#{header.titulo}">Patitas Felices</h1>
            <p class="encabezado-eslogan mb-0" th:text="#{header.eslogan}">Eslogan</p>
        </div>
    </div>
</header>

<!-- NAVBAR -->
<nav th:fragment="barraNavegacion" class="navbar navbar-expand-lg barra-clinica sticky-top">
    <div class="container">
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal" aria-controls="menuPrincipal"
                aria-expanded="false" aria-label="Menú">
            <i class="bi bi-list text-white fs-2"></i>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'inicio'} ? 'active'"
                       th:href="@{/}"><i class="bi bi-house-heart me-1"></i><span th:text="#{nav.inicio}">Inicio</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'tipos'} ? 'active'"
                       th:href="@{/tipos}"><i class="bi bi-tags me-1"></i><span th:text="#{nav.tipos}">Tipos</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'servicios'} ? 'active'"
                       th:href="@{/servicios}"><i class="bi bi-heart-pulse me-1"></i><span th:text="#{nav.servicios}">Servicios</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${seccion == 'citas'} ? 'active'"
                       th:href="@{/citas}"><i class="bi bi-calendar-check me-1"></i><span th:text="#{nav.citas}">Citas</span></a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/#consultas}"><i class="bi bi-chat-dots me-1"></i><span th:text="#{nav.consultas}">Consultas</span></a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- TOASTS (mensajes de resultado enviados con RedirectAttributes) -->
<div th:fragment="notificaciones" class="toast-container position-fixed top-0 end-0 p-3">
    <div th:if="${mensajeExito}" class="toast align-items-center text-bg-success border-0" role="alert"
         aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body"><i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensajeExito}"></span></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>
    <div th:if="${mensajeError}" class="toast align-items-center text-bg-danger border-0" role="alert"
         aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body"><i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${mensajeError}"></span></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer th:fragment="piePagina" class="pie-clinica mt-5">
    <div class="container py-4">
        <div class="row gy-2 align-items-center">
            <div class="col-md-6">
                <p class="mb-0 fw-semibold" th:text="#{footer.derechos}">Derechos</p>
            </div>
            <div class="col-md-6 text-md-end small">
                <span class="me-3"><i class="bi bi-geo-alt-fill me-1"></i><span th:text="#{footer.direccion}">Dirección</span></span>
                <span class="me-3"><i class="bi bi-telephone-fill me-1"></i><span th:text="#{footer.telefono}">Teléfono</span></span>
                <span><i class="bi bi-envelope-fill me-1"></i><span th:text="#{footer.correo}">Correo</span></span>
            </div>
        </div>
    </div>
</footer>

<!-- MODAL DE CONFIRMACIÓN PARA ELIMINAR (se reutiliza en tipos y servicios) -->
<div th:fragment="modalEliminar(accion)" class="modal fade" id="modalEliminar" tabindex="-1"
     aria-labelledby="tituloModalEliminar" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="tituloModalEliminar" th:text="#{modal.titulo}">Confirmar eliminación</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form th:action="@{${accion}}" method="post">
                <div class="modal-body">
                    <p class="mb-0">
                        <span th:text="#{modal.mensaje}">¿Está seguro de que desea eliminar</span>
                        <strong id="nombreElemento"></strong>?
                    </p>
                    <input type="hidden" name="id" id="idElemento">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" th:text="#{modal.cancelar}">Cancelar</button>
                    <button type="submit" class="btn btn-danger" th:text="#{modal.eliminar}">Sí, eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
