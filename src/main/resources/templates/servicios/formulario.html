<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: plantilla(~{::title}, ~{::main})}">
<head>
    <title>Servicio | Patitas Felices</title>
</head>
<body>
<main class="container pt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <h2 class="titulo-pagina" th:text="${servicio.id == null} ? 'Agregar servicio' : 'Editar servicio'">Servicio</h2>
            <form class="formulario-clinica" th:action="@{/servicios/guardar}" th:object="${servicio}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" id="nombre" class="form-control" th:field="*{nombre}" maxlength="100" required>
                </div>
                <div class="mb-3">
                    <label for="tipoServicio" class="form-label">Tipo de servicio</label>
                    <select id="tipoServicio" class="form-select" th:field="*{tipoServicio.id}" required>
                        <option value="" disabled>Seleccione un tipo</option>
                        <option th:each="tipo : ${listaTipos}"
                                th:value="${tipo.id}"
                                th:text="${tipo.nombre}">Tipo</option>
                    </select>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="precio" class="form-label">Precio (₡)</label>
                        <input type="number" id="precio" class="form-control" th:field="*{precio}"
                               step="0.01" min="0" required>
                    </div>
                    <div class="col-md-6">
                        <label for="duracionMinutos" class="form-label">Duración (minutos)</label>
                        <input type="number" id="duracionMinutos" class="form-control" th:field="*{duracionMinutos}"
                               min="1" required>
                    </div>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <a class="btn btn-outline-secondary" th:href="@{/servicios}">Cancelar</a>
                    <button type="submit" class="btn btn-clinica"><i class="bi bi-check2-circle me-1"></i>Guardar servicio</button>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
