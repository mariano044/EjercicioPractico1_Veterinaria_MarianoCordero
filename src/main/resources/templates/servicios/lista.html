<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: plantilla(~{::title}, ~{::main})}">
<head>
    <title>Servicios | Patitas Felices</title>
</head>
<body>
<main class="container pt-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h2 class="titulo-pagina mb-0">Servicios veterinarios</h2>
        <a class="btn btn-clinica" th:href="@{/servicios/nuevo}"><i class="bi bi-plus-circle me-1"></i>Agregar servicio</a>
    </div>

    <div class="tabla-clinica table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Tipo</th>
                <th class="text-end">Precio</th>
                <th class="text-center">Duración</th>
                <th class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="servicio : ${listaServicios}">
                <td class="fw-semibold" th:text="${servicio.nombre}">Nombre</td>
                <td><span class="badge insignia-tipo" th:text="${servicio.tipoServicio.nombre}">Tipo</span></td>
                <td class="text-end" th:text="'₡' + ${#numbers.formatDecimal(servicio.precio, 1, 'COMMA', 2, 'POINT')}">₡0.00</td>
                <td class="text-center" th:text="${servicio.duracionMinutos} + ' min'">30 min</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/servicios/editar/{id}(id=${servicio.id})}">
                        <i class="bi bi-pencil-square"></i> Editar</a>
                    <button type="button" class="btn btn-sm btn-outline-danger"
                            data-bs-toggle="modal" data-bs-target="#modalEliminar"
                            th:attr="data-id=${servicio.id}, data-nombre=${servicio.nombre}">
                        <i class="bi bi-trash3"></i> Eliminar
                    </button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listaServicios)}">
                <td colspan="5" class="text-center text-muted py-4">Aún no hay servicios. Agregue el primero.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/componentes :: modalEliminar('/servicios/eliminar')}"></div>
</main>
</body>
</html>
